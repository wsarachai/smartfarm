name: edge-ctrl Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'edge-ctrl/**'
      - '.github/workflows/edge-ctrl-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'edge-ctrl/**'
      - '.github/workflows/edge-ctrl-build.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build C++ Daemon & Test Python Scripts
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install C++ & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libgpiod-dev nlohmann-json3-dev

      - name: Cache CMake Build
        uses: actions/cache@v4
        with:
          path: edge-ctrl/build
          key: ${{ runner.os }}-edge-ctrl-${{ hashFiles('edge-ctrl/CMakeLists.txt', 'edge-ctrl/src/**') }}
          restore-keys: |
            ${{ runner.os }}-edge-ctrl-

      - name: Configure CMake
        run: |
          mkdir -p edge-ctrl/build
          cd edge-ctrl/build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build edge-ctrl Target
        run: |
          cd edge-ctrl/build
          make -j$(nproc)

      - name: Run CTest Unit Tests
        run: |
          cd edge-ctrl/build
          ctest --output-on-failure

      - name: Validate Python Provisioning Scripts
        run: |
          python3 -m py_compile edge-ctrl/python/*.py

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-ctrl-binary
          path: edge-ctrl/build/edge-ctrl
          if-no-files-found: error
