name: sensor-zone Firmware Build

on:
  push:
    branches: [ main ]
    paths:
      - 'sensor-zone/**'
      - '.github/workflows/sensor-zone-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sensor-zone/**'
      - '.github/workflows/sensor-zone-build.yml'
  workflow_dispatch:

jobs:
  build-sensor-zone:
    name: Build Sensor Zone ESP-IDF Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install PlatformIO CLI
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO Core Packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-sensor-zone-${{ hashFiles('sensor-zone/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-sensor-zone-

      - name: Compile ESP32 Sensor Zone Firmware
        run: |
          cd sensor-zone
          pio run

      - name: Upload Sensor Zone Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensor-zone-firmware
          path: sensor-zone/.pio/build/*/firmware.bin
          if-no-files-found: error
