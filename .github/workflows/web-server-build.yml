name: web-server Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'web-server/**'
      - '.github/workflows/web-server-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web-server/**'
      - '.github/workflows/web-server-build.yml'
  workflow_dispatch:

jobs:
  build-client-and-server:
    name: Test Node Server & Build React Frontend
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'web-server/package-lock.json'

      - name: Install Web Server Dependencies
        run: |
          cd web-server
          npm ci

      - name: Install & Compile React Client Dashboard
        run: |
          cd web-server/client
          npm ci
          npm run build

      - name: Upload Static UI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist-bundle
          path: web-server/client/dist
          if-no-files-found: error

  docker-build:
    name: Test Build Docker Container
    runs-on: ubuntu-22.04
    needs: build-client-and-server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./web-server
          file: ./web-server/Dockerfile
          push: false
          tags: smartfarm-web-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
