name: pump-zone Firmware Build

on:
  push:
    branches: [ main ]
    paths:
      - 'pump-zone/**'
      - 'pump-zone-esp01/**'
      - '.github/workflows/pump-zone-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pump-zone/**'
      - 'pump-zone-esp01/**'
      - '.github/workflows/pump-zone-build.yml'
  workflow_dispatch:

jobs:
  build-pump-zone:
    name: Build Pump Zone PlatformIO Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install PlatformIO CLI
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO Core Packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-pump-zone-${{ hashFiles('pump-zone/platformio.ini', 'pump-zone-esp01/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-pump-zone-

      - name: Compile ESP-IDF Pump Controller Firmware
        run: |
          cd pump-zone
          pio run

      - name: Compile ESP01 Relay Firmware
        run: |
          cd pump-zone-esp01
          pio run

      - name: Upload ESP-IDF Pump Zone Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pump-zone-firmware
          path: pump-zone/.pio/build/*/firmware.bin
          if-no-files-found: error

      - name: Upload ESP01 Relay Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pump-zone-esp01-firmware
          path: pump-zone-esp01/.pio/build/*/firmware.bin
          if-no-files-found: warn
