# smartfarm-ai — AI decision service overlay for Raspberry Pi (generic CPU / ARM).
#
# Runs the stdlib HTTP decision service (ai_service.py) that the web-server calls
# for AI decisions. This version builds a lightweight Python image suitable for
# Raspberry Pi (no NVIDIA GPU runtime required).
#
# Run AFTER the base compose (which creates the shared smartfarm-net) is up:
#   (in web-server/)    docker compose -f docker-compose.yaml up -d
#   (in smartfarm-ai/)  docker compose -f docker-compose.rpi.yaml up -d
services:
  ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfarm-ai
    restart: unless-stopped
    working_dir: /smartfarm-ai
    networks:
      - smartfarm-net
    ports:
      - "8000:8000" # AI decision service (web-server calls http://smartfarm-ai:8000)
    environment:
      AI_SERVICE_PORT: "8000"
      # Where this service can reach the web-server
      WEB_SERVER_URL: http://web-server:3000
    volumes:
      # Mount the codebase for live code changes without rebuilding
      - ./:/smartfarm-ai

networks:
  # Created by the base compose (web-server/docker-compose.yaml).
  smartfarm-net:
    external: true
    name: smartfarm-net
