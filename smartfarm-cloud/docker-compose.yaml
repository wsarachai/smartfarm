services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001" # websockets — cloudflared connects here
      - "127.0.0.1:1883:1883" # plain mqtt — localhost only
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  postgres:
    image: postgres:16-alpine
    container_name: smartfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  dashboard:
    build:
      context: .
      # Must be a build arg, not a runtime `environment:` entry — NEXT_PUBLIC_*
      # vars are inlined into the client bundle at `next build` time (see
      # Dockerfile). Change this value AND rebuild (`--build`) to repoint the
      # dashboard at a different hub; a plain `up -d` restart won't pick it up.
      args:
        NEXT_PUBLIC_HUB_ID: rasp-01
    container_name: smartfarm-dashboard
    restart: unless-stopped
    depends_on:
      - postgres
      - mosquitto
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MQTT_URL: ws://mosquitto:9001
      MQTT_USERNAME: dashboard-backend
      MQTT_PASSWORD: ${DASHBOARD_MQTT_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
