; water-temp-node — NUCLEO-WL55JC1 hot/cold water temperature LoRa sensor node.
;
; Framework = arduino (STM32duino). NOTE: PlatformIO has NO stm32cube framework
; for the STM32WL family (no framework-stm32cubewl package exists in the official
; or maxgerhardt platforms — the WL board only offers arduino/zephyr). STM32duino
; IS the STM32Cube HAL underneath, so our hand-written HAL_SUBGHZ LoRa driver
; still compiles as-is; we just enable HAL_SUBGHZ via include/hal_conf_extra.h.
;
; Flash over the board's onboard ST-LINK via USB (upload_protocol = stlink also
; works with an external ST-Link V2 on SWD). First `pio run` downloads the
; STM32duino core (large, one-time).
[env:nucleo_wl55jc]
platform      = ststm32
board         = nucleo_wl55jc
framework     = arduino
upload_protocol = stlink
debug_tool    = stlink
monitor_speed = 115200

; No external libraries: deep sleep (Stop2) + RTC wake are done with raw HAL in
; main.cpp. We avoid the STM32duino Low Power / RTC libs on purpose — their 2.0.0
; releases hard-#error against the older STM32 core that PlatformIO's ststm32
; platform bundles, and only 2.0.0 / 1.5.0 exist in the registry. STM32duino IS
; the Cube HAL, so HAL_PWREx_EnterSTOP2Mode + HAL_RTC are available directly.

build_flags =
    -I include
    -I src
    -Wall

; Exclude the F103-only bring-up tests (src/test/) and the external-SX127x driver
; (sx1278.cpp — only for the F103 module test) from the WL55 firmware.
build_src_filter = +<*> -<test/> -<sx1278.cpp>


; ---------------------------------------------------------------------------
; DS18B20 sensor bring-up test on an STM32F103C8T6 "Blue Pill".
; Used while the NUCLEO-WL55JC1 boards are on back-order: it reuses the SAME
; ds18b20.cpp driver (no copy) to validate the sensor + wiring, and builds ONLY
; that driver + src/test/ds18b20_test_main.cpp — the WL55 main/battery/LoRa are
; filtered out. Prints readings over USB CDC (the board's micro-USB). Flash with
; an ST-Link V2 on the SWD header:  pio run -e bluepill_f103c8 -t upload
; ---------------------------------------------------------------------------
; Shared settings for both F103 test envs (USB-CDC and semihosting variants).
[bluepill_base]
platform      = ststm32
board         = bluepill_f103c8
framework     = arduino
upload_protocol = stlink
debug_tool    = stlink
monitor_speed = 115200
; Build only the DS18B20 driver + the test main; drop everything WL55-specific.
build_src_filter = -<*> +<ds18b20.cpp> +<test/ds18b20_test_main.cpp>

; Output over native USB (micro-USB); no adapter needed and PA9/PA10 stay free.
; NOTE: some Blue Pill CLONES have a wrong USB pull-up (R10 = 10k not 1.5k) and
; won't enumerate — add a 1.5k PA12->3V3, or use the semihosting env below.
[env:bluepill_f103c8]
extends = bluepill_base
build_flags =
    -I include
    -I src
    -Wall
    -D USBCON
    -D USBD_USE_CDC

; Output over SEMIHOSTING via the ST-Link/SWD — no USB, no UART, no adapter. View
; it in the OpenOCD console. Handy when a clone's native USB won't enumerate.
; Requires a debugger attached (`arm semihosting enable`) — see the README:
;   pio run  -e bluepill_f103c8_semihosting -t upload
;   openocd ... -c "init" -c "arm semihosting enable" -c "reset run"   (streams output)
[env:bluepill_f103c8_semihosting]
extends = bluepill_base
build_flags =
    -I include
    -I src
    -Wall
    -D USE_SEMIHOSTING
    ; Bench: no external 4.7k on hand -> use the MCU internal pull-up (~40k).
    ; Short single-probe bus only. Remove once a real 4.7k pull-up is fitted.
    -D DS18B20_INTERNAL_PULLUP
; Semihosting output shows up during a DEBUG session (not the Monitor button).
; This enables it automatically when you start debugging; press Continue (F5) and
; the readings stream into the VSCode "Debug Console". Run it live for output:
debug_extra_cmds =
    monitor arm semihosting enable

; SX1278 (SX127x) external LoRa module bench self-test @ 433 MHz. Standalone check
; of the module + SPI wiring (SX1278 is 433 MHz -> can't reach the 923 MHz WL55
; gateway). Reuses semihosting output over SWD. Define SX1278_RX_MODE (below) on a
; second board to make it listen instead of beacon. Wiring: NSS=PA4 SCK=PA5
; MISO=PA6 MOSI=PA7 RESET=PB0 DIO0=PB1, VCC=3V3 (not 5V), antenna required.
;   pio run -e bluepill_f103c8_sx1278 -t upload   (then debug/semihosting to view)
[env:bluepill_f103c8_sx1278]
extends = bluepill_base
build_flags =
    -I include
    -I src
    -Wall
    -D USE_SEMIHOSTING
    ; -D SX1278_RX_MODE   ; uncomment on a 2nd board to receive instead of transmit
build_src_filter = -<*> +<sx1278.cpp> +<test/sx1278_test_main.cpp>
debug_extra_cmds =
    monitor arm semihosting enable

; Full prototype NODE: DS18B20 (PB6/PB7) -> 12-byte lora_packet -> SX1278 TX @433.
; The counterpart to the lora-pi-receiver/ Python gateway on the Raspberry Pi.
; Reuses ds18b20.cpp + sx1278.cpp + battery.cpp + lora/lora_packet.h. Semihosting.
; PHY (433/SF9/BW125/CR4-5/sync 0x12) MUST match lora-pi-receiver/.env.
;   pio run -e bluepill_f103c8_node -t upload
[env:bluepill_f103c8_node]
extends = bluepill_base
build_flags =
    -I include
    -I src
    -Wall
    -D USE_SEMIHOSTING
    -D DS18B20_INTERNAL_PULLUP
build_src_filter = -<*> +<ds18b20.cpp> +<sx1278.cpp> +<test/node_sender_main.cpp>
debug_extra_cmds =
    monitor arm semihosting enable

; STANDALONE node — same as bluepill_f103c8_node but WITHOUT semihosting, so it
; runs on its own from any USB/battery power (the semihosting BKPT faults with no
; debugger attached). It reads DS18B20 + TX's the frame silently (out() -> a UART
; Serial, harmless if unconnected). Flash once, then just power the board.
;   pio run -e bluepill_f103c8_node_standalone -t upload
[env:bluepill_f103c8_node_standalone]
extends = bluepill_base
build_flags =
    -I include
    -I src
    -Wall
    -D DS18B20_INTERNAL_PULLUP
build_src_filter = -<*> +<ds18b20.cpp> +<sx1278.cpp> +<test/node_sender_main.cpp>
