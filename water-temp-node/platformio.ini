; water-temp-node — NUCLEO-WL55JC1 hot/cold water temperature LoRa sensor node.
; STM32Cube HAL (no Arduino). Flash over the board's onboard ST-LINK via USB
; (upload_protocol = stlink also works with an external ST-Link V2 on SWD).
;
; First `pio run` downloads the ststm32 platform + STM32WL HAL (slow, one-time).
[env:nucleo_wl55jc]
platform      = ststm32
board         = nucleo_wl55jc
framework     = stm32cube
upload_protocol = stlink
debug_tool    = stlink
monitor_speed = 115200

; Our stm32wlxx_hal_conf.h (enables HAL_SUBGHZ) lives in include/ and must be
; found before any framework default — include/ is on the path first.
build_flags =
    -I include
    -I src
    -Wall
