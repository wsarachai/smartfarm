; lora-gateway — NUCLEO-WL55JC1 receive-only LoRa gateway. Prints one JSON line
; per received frame out Serial (ST-LINK VCP). Pair with bridge/ on the host.
;
; Framework = arduino (STM32duino). PlatformIO has no stm32cube framework for the
; STM32WL family, but STM32duino IS the Cube HAL underneath, so our HAL_SUBGHZ
; LoRa driver compiles as-is (HAL_SUBGHZ enabled via include/hal_conf_extra.h).
; Flash over the onboard ST-LINK via USB.
[env:nucleo_wl55jc]
platform      = ststm32
board         = nucleo_wl55jc
framework     = arduino
upload_protocol = stlink
debug_tool    = stlink
monitor_speed = 115200

build_flags =
    -I include
    -I src
    -Wall
