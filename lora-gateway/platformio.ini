; lora-gateway — NUCLEO-WL55JC1 receive-only LoRa gateway. Prints one JSON line
; per received frame out LPUART1 (ST-LINK VCP). Pair with bridge/ on the host.
; STM32Cube HAL, flashed over the onboard ST-LINK via USB.
[env:nucleo_wl55jc]
platform      = ststm32
board         = nucleo_wl55jc
framework     = stm32cube
upload_protocol = stlink
debug_tool    = stlink
monitor_speed = 115200

build_flags =
    -I include
    -I src
    -Wall
